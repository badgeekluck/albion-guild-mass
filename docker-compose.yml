x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: albion-app
  restart: unless-stopped
  working_dir: /var/www
  volumes:
    - .:/var/www
  networks:
    - albion-project

services:
  app:
    <<: *app
    container_name: albion-app
    environment:
      APP_ROLE: app
      APP_DEV_SEED: ${APP_DEV_SEED:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/var/www/storage/framework/.docker-ready"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 120s

  reverb:
    <<: *app
    container_name: albion-reverb
    environment:
      APP_ROLE: worker
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    depends_on:
      app:
        condition: service_healthy

  queue:
    <<: *app
    container_name: albion-queue
    environment:
      APP_ROLE: worker
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--max-time=3600"]
    depends_on:
      app:
        condition: service_healthy

  # Builds the frontend assets once (public/build) and exits.
  assets:
    image: node:24-alpine
    container_name: albion-assets
    working_dir: /var/www
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run build"]
    volumes:
      - .:/var/www
      - node_modules:/var/www/node_modules
    networks:
      - albion-project

  nginx:
    image: nginx:1.29-alpine
    container_name: albion-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8088}:80"
    volumes:
      - .:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
      reverb:
        condition: service_started
      assets:
        condition: service_completed_successfully
    networks:
      - albion-project

  db:
    image: mysql:8.4
    container_name: albion-db
    restart: unless-stopped
    # Only reachable from this machine (for DB clients). Never expose it publicly.
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-33306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-albion_guild}
      MYSQL_USER: ${DB_USERNAME:-albion}
      MYSQL_PASSWORD: ${DB_PASSWORD:-albion_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-albion_root_secret}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - albion-project

networks:
  albion-project:
    driver: bridge

volumes:
  dbdata:
    driver: local
  node_modules:
    driver: local
